name: Data Quality Pipeline Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: |
        python -m pytest

    - name: Run Data Quality Check on Reference Data
      run: |
        python data_quality_pipeline.py data/base_referencia.csv --ref data/base_referencia.csv

    - name: Run Data Quality Check on Production New Data
      continue-on-error: true
      run: |
        python data_quality_pipeline.py data/novos_dados.csv --ref data/base_referencia.csv
